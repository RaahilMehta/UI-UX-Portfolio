<html lang="en">

<style>
    #btn{
        padding: 10px 14px;
        background-color: red;
        color: white;
        border: 2px solid black;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
    }


    

</style>
<body>
    <div class="container">

        <h2>This is my headi</h2>
        <p id="para">Lorem ipsum dolor sit amet consectetur adipisicing elit. Consectetur et aut ducimus
        similique fugiat, ab ad impedit voluptates minima ut, reprehenderit alias quibusdam atque delectus totam, quo quisquam eveniet 
        sequi!
    </p>
    </div>
    <button id = "btn" onclick="hide()">Show/Hide</button>

    <script>
        let para = document.getElementById('para');
        para.addEventListener('mouseover', function run(){
            alert('mouse inside')

        })
    function hide() {
        let btn = document.getElementById("btn");
        let para = document.getElementById('para');
        if(para.style.display != "none"){
        para.style.display = "none";
        }
        else{
        para.style.display = "block";
        }
    }
    </script>
